<body>

<img src="imagens/estante.webp" alt="Estante com vários livros disponíveis">

<p>Reserve seu livro favorito gratuitamente.</p>
<p>
<label for="nome-usuario">Seu Nome:</label>
<input type="text" id="nome-usuario" required>
</p>
<p>
<label for="email-user">Seu E-mail:</label>
<input type="email" id="email-user" required>
</p>


<fieldset>
    <legend>Tipo de Retirada:</legend>
    <input type="radio" id="balcao" name="tipo-retirar" value="balcao">
    <label for="balcao">Retirar no balcão</label><br>
    <input type="radio" id="casa" name="tipo-entrega" value="casa">
    <label for="casa">Entrega em casa</label><br>
</fieldset>

<fieldset>
  <legend>Generos Favoritos:</legend>

  <input type="checkbox" id="ficção" name="genero" value="ficção">
  <label for="ficção">Ficção</label><br>

  <input type="checkbox" id="tecnologia" name="genero" value="tecnologia">
  <label for="tecnologia">Tecnologia</label><br>
  </main>

  <button type="submit">Confirmar Reserva</button>

  <footer>
